    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    odom_topic: /demo/odom

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.45
      max_vel_y: 0.0
      max_vel_theta: 3.2
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 3.2
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -3.2
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 30
      vy_samples: 30
      vtheta_samples: 30
      sim_time: 2.5
      linear_granularity: 0.03 # 用于控制轨迹生成过程中的线性运动粒度，即轨迹离散化时沿直线方向的采样间隔（单位为米）。该参数主要影响局部规划器（如DWB控制器）在模拟轨迹时的分辨率
      angular_granularity: 0.025 
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True

      # 振荡预防参数
      oscillation_reset_dist: 0.05  # 振荡重置距离
      oscillation_reset_angle: 0.1   # 振荡重置角度
      # 启用振荡检测
      use_oscillation_recovery: true
      oscillation_vdist: 0.25        # 振荡检测距离阈值
      oscillation_omega: 0.5         # 振荡检测角速度阈值

      critics:
        [
          "RotateToGoal", # 强制机器人在接近目标时旋转到目标方向，避免不必要的旋转动作。
          "Oscillation", # 防止机器人仅在原地前后摇摆，确保有效移动。
          "BaseObstacle", # 基于路径经过的代价地图位置评估障碍物风险。
          "GoalAlign", # 确保轨迹使机器人姿态与目标姿态对齐。
          "PathAlign", # 优化轨迹与全局路径的对齐度，减少偏离。
          "PathDist", # 评估轨迹与全局路径的距离，优先选择更接近路径的轨迹。
          "GoalDist", # 基于轨迹使机器人与目标姿势的接近程度评分。
        ]
      BaseObstacle.scale: 0.01 # 调整障碍物检测的敏感度。较小的值（如0.02）意味着机器人对障碍物的响应更敏感，更容易避开障碍物
      PathAlign.scale: 60.0 # 优化轨迹与全局路径的对齐度。较大的值（如32.0）优先选择与全局路径更接近的轨迹
      PathAlign.forward_point_distance: 0.1 # 定义路径对齐时的参考点距离。0.1米表示在0.1米前方评估路径对齐度
      GoalAlign.scale: 20.0 # 确保轨迹使机器人姿态与目标姿态对齐。较大的值（如24.0）优先选择姿态对齐的轨迹
      GoalAlign.forward_point_distance: 0.1 # 定义姿态对齐时的参考点距离。0.1米表示在0.1米前方评估姿态对齐度
      PathDist.scale: 60.0 # 评估轨迹与全局路径的距离。较大的值（如32.0）优先选择更接近路径的轨迹
      GoalDist.scale: 20.0 # 基于轨迹使机器人与目标姿势的接近程度评分。较大的值（如24.0）优先选择接近目标的轨迹
      RotateToGoal.scale: 20.0 # 强制机器人在接近目标时旋转到目标方向。较大的值（如32.0）优先选择旋转对齐的轨迹
      RotateToGoal.slowing_factor: 1.0 # 定义旋转动作的减速因子。5.0表示旋转时速度减慢5倍
      RotateToGoal.lookahead_time: -1.0 # 定义旋转动作的前瞻时间。-1.0表示使用默认值（通常是1秒）
      Oscillation.scale: 10.0  # 如果原来没有，添加此项

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.21, 0.195], [0.21, -0.195], [-0.21, -0.195], [-0.21, 0.195] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        # scan:
        #   topic: /scan
        #   max_obstacle_height: 2.0
        #   clearing: True
        #   marking: True
        #   data_type: "LaserScan"
        #   raytrace_max_range: 3.0
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 2.5
        #   obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.1
      resolution: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: scan
      #   scan:
      #     topic: /scan
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "LaserScan"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.08
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "my_occupancy_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25 # 定义空闲区域的阈值。0.25表示栅格占据率小于0.25的区域视为空闲
    occupied_thresh_default: 0.65 # 定义障碍物区域的阈值。0.65表示栅格占据率大于0.65的区域视为障碍物
    map_subscribe_transient_local: True # 启用地图订阅的本地持久化。True表示使用本地持久化订阅。提高地图数据的可靠性，避免因网络延迟导致数据丢失。

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.01 # 请求的目标位姿与路径终点之间的容许误差（单位为米）
      use_astar: true # 是否使用A*算法。否则使用Dijkstra扩展算法
      allow_unknown: false # 是否允许在未知空间中进行路径规划

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw # 指定局部代价地图的话题名称
    footprint_topic: local_costmap/published_footprint # 指定机器人足迹的话题名称
    cycle_frequency: 10.0 # 定义恢复服务器的循环频率（Hz）
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin" # 原地旋转以尝试摆脱困境
    backup:
      plugin: "nav2_recoveries/BackUp" # 后退以脱离障碍物
    wait:
      plugin: "nav2_recoveries/Wait" # 原地等待以期望环境变化
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1 # 坐标变换超时时间为0.1秒
    use_sim_time: true
    simulate_ahead_time: 2.0 # 向前模拟2秒的时间
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2 # 旋转加速度限制为3.2 rad/s²

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200